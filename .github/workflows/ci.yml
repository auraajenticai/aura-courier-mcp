name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-security-gate:
    name: Build, Security Tests, Audit & Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check, build & dist parity check
        run: |
          npx tsc --noEmit
          npm run build
          git diff --exit-code dist/

      - name: Run full regression + adversarial security test suite
        run: npm test

      - name: Production dependency security audit gate (critical/high)
        run: npm audit --omit=dev --audit-level=high

      - name: Docker multi-stage non-root build verification
        run: docker build -t aura-courier-mcp:ci .

      - name: Verify Dist Artifacts
        run: ls -la dist/
